services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
      target: api
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set the internal PostgreSQL URL in Coolify}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a random JWT access secret in Coolify}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a different random JWT refresh secret in Coolify}
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/app.Dockerfile
      target: web
    environment:
      SERVICE_URL_WEB: /
    expose:
      - '80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
