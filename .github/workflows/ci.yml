name: CI

on:
  # workflow_dispatch:
  pull_request:
    branches: [master, dev]

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: resume
          POSTGRES_DB: resume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resume -d resume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: |
          mkdir -p reports
          pnpm exec eslint . -f json -o reports/eslint.json

      - name: Unit tests
        run: >
          pnpm exec vitest run --project web --project api --coverage
          --reporter=default --reporter=json
          --outputFile.json=reports/vitest-unit.json

      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder@placeholder/placeholder
        run: pnpm build

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://resume:resume@127.0.0.1:5432/resume_test
        run: pnpm --filter @online-resume/api db:migrate

      - name: API integration tests
        env:
          TEST_DATABASE_URL: postgresql://resume:resume@127.0.0.1:5432/resume_test
        run: >
          pnpm --filter @online-resume/api exec vitest run
          --config vitest.integration.config.mts
          --reporter=default --reporter=json
          --outputFile.json=../../reports/vitest-api-integration.json

      - name: Install Chromium
        run: pnpm --filter @online-resume/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: |
          (cd apps/web && exec ./node_modules/.bin/rsbuild preview --host 127.0.0.1 --port 4174 --strict-port) > reports/rsbuild-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ > /dev/null
          pnpm test:browser

      - name: Summary
        run: |
          eslint_errors=$(jq '[.[].errorCount] | add // 0' reports/eslint.json)
          eslint_warnings=$(jq '[.[].warningCount] | add // 0' reports/eslint.json)
          unit_passed=$(jq '.numPassedTests' reports/vitest-unit.json)
          unit_failed=$(jq '.numFailedTests' reports/vitest-unit.json)
          integration_passed=$(jq '.numPassedTests' reports/vitest-api-integration.json)
          integration_failed=$(jq '.numFailedTests' reports/vitest-api-integration.json)
          browser_passed=$(jq '.stats.expected' reports/playwright-browser.json)
          browser_failed=$(jq '.stats.unexpected' reports/playwright-browser.json)
          pct() { jq -n --argjson n "$1" '"\(($n * 100 | round) / 100)%"'; }
          line_coverage=$(pct "$(jq '.total.lines.pct' coverage/coverage-summary.json)")
          branch_coverage=$(pct "$(jq '.total.branches.pct' coverage/coverage-summary.json)")
          function_coverage=$(pct "$(jq '.total.functions.pct' coverage/coverage-summary.json)")
          statement_coverage=$(pct "$(jq '.total.statements.pct' coverage/coverage-summary.json)")
          if git rev-parse --verify --quiet origin/master >/dev/null; then
            commits=$(git rev-list --count origin/master..HEAD)
            diff_stat=$(git diff --shortstat origin/master...HEAD)
            if [ -z "$diff_stat" ]; then
              diff_stat="0"
            fi
          else
            commits="n/a"
            diff_stat="n/a"
          fi
          {
            echo "## CI Metrics"
            echo
            echo "### Code Quality"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| ESLint errors | ${eslint_errors} |"
            echo "| ESLint warnings | ${eslint_warnings} |"
            echo
            echo "### Tests"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Unit tests passed | ${unit_passed} |"
            echo "| Unit tests failed | ${unit_failed} |"
            echo "| API integration tests passed | ${integration_passed} |"
            echo "| API integration tests failed | ${integration_failed} |"
            echo "| Browser tests passed | ${browser_passed} |"
            echo "| Browser tests failed | ${browser_failed} |"
            echo "| Line coverage | ${line_coverage} |"
            echo "| Branch coverage | ${branch_coverage} |"
            echo "| Function coverage | ${function_coverage} |"
            echo "| Statement coverage | ${statement_coverage} |"
            echo
            echo "### Development"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Commits ahead of master | ${commits} |"
            echo "| Diff vs master | ${diff_stat} |"
            echo "| CI success rate | Shown by GitHub Actions |"
            echo "| Pipeline duration | Shown by GitHub Actions |"
            echo
            echo "### Build"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Build | Passed |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: |
            reports
            coverage
